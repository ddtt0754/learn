<style>
  /* ============ 全局 ============ */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --green:#2ebd85;
    --green-deep:#1fa873;
    --blue:#2f9df0;
    --text:#33434b;
    --text-light:#8aa09a;
    --card:#ffffff;
    --shadow:0 8px 22px rgba(47,157,240,.10);
    --radius:16px;
  }
  html,body{height:100%;}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);
    color:var(--text);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:28px 16px calc(40px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  .container{
    width:100%;
    max-width:620px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ============ 顶部标题卡（绿蓝渐变） ============ */
  .title-card{
    position:relative;
    width:100%;
    background:linear-gradient(135deg,#35d29a 0%,#2f9df0 100%);
    border-radius:22px;
    padding:30px 20px 26px;
    text-align:center;
    color:#fff;
    overflow:hidden;
    box-shadow:0 14px 30px rgba(47,157,240,.25);
  }
  .title-card::before,.title-card::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.14);
  }
  .title-card::before{width:120px;height:120px;top:-40px;right:-30px;}
  .title-card::after{width:70px;height:70px;bottom:-24px;left:-16px;}
  .title-card h1{
    position:relative;
    font-size:23px;
    letter-spacing:2px;
    font-weight:700;
    text-shadow:0 2px 6px rgba(0,0,0,.12);
  }
  .title-card .sub{
    position:relative;
    margin-top:10px;
    font-size:13px;
    letter-spacing:3px;
    opacity:.92;
  }

  /* 数据来源说明 */
  .source{
    width:100%;
    margin-top:10px;
    text-align:center;
    font-size:11px;
    line-height:1.6;
    color:var(--text-light);
    letter-spacing:.3px;
    padding:0 8px;
  }

  /* ============ 统计条 ============ */
  .stats{
    width:100%;
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }
  .stats div{
    background:#fff;
    border-radius:12px;
    padding:11px 4px;
    text-align:center;
    box-shadow:0 4px 10px rgba(47,157,240,.06);
  }
  .stats b{
    display:block;
    font-size:17px;
    font-weight:700;
    color:var(--green-deep);
    letter-spacing:.5px;
  }
  .stats span{font-size:11px;color:var(--text-light);letter-spacing:.5px;}

  /* ============ 顶部下拉导航（学段 + 学科） ============ */
  .sel-row{
    width:100%;
    margin-top:16px;
    display:grid;
    grid-template-columns:1fr 1.35fr;
    gap:8px;
  }
  .sel-wrap{
    position:relative;
    background:#fff;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(47,157,240,.08);
  }
  .sel-wrap::after{
    content:"";
    position:absolute;
    right:14px;
    top:50%;
    width:7px;
    height:7px;
    border-right:2px solid var(--green-deep);
    border-bottom:2px solid var(--green-deep);
    transform:translateY(-70%) rotate(45deg);
    pointer-events:none;
  }
  .sel{
    width:100%;
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    padding:12px 32px 12px 14px;
    border-radius:12px;
    -webkit-appearance:none;
    -moz-appearance:none;
    appearance:none;
    text-align:left;
    text-align-last:left;
    cursor:pointer;
    touch-action:manipulation;
  }
  .sel option{color:var(--text);background:#fff;font-weight:400;}
  .sel:focus{box-shadow:0 0 0 2px rgba(47,157,240,.18);}

  /* ============ 当前信息栏 ============ */
  .info{
    width:100%;
    margin-top:14px;
    background:#fff;
    border-radius:12px;
    padding:9px 12px;
    text-align:center;
    font-size:13px;
    color:var(--text-light);
    box-shadow:0 4px 10px rgba(47,157,240,.06);
  }
  .info b{color:var(--green-deep);font-weight:600;}

  /* ============ 名师卡片 ============ */
  .list{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:14px;
  }
  .teacher{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    animation:riseIn .35s ease backwards;
  }
  @keyframes riseIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  .t-head{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .t-rank{
    flex:none;
    width:24px;height:24px;
    border-radius:8px;
    background:linear-gradient(135deg,#35d29a,#2f9df0);
    color:#fff;
    font-size:12px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .t-name{
    font-size:16px;
    font-weight:700;
    letter-spacing:.3px;
    color:var(--text);
  }
  .t-desc{
    margin-top:10px;
    font-size:12.5px;
    line-height:1.65;
    color:var(--text-light);
  }
  .t-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:12px;
    padding:8px 16px;
    border-radius:999px;
    background:linear-gradient(135deg,#35d29a,#2f9df0);
    color:#fff;
    font-size:12.5px;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 5px 14px rgba(47,157,240,.28);
    transition:transform .15s,box-shadow .25s;
    touch-action:manipulation;
  }
  .t-link:active{transform:scale(.96);}

  /* 备选 */
  .alt{
    width:100%;
    margin-top:12px;
    background:#f2faf6;
    border-radius:12px;
    padding:10px 13px;
    font-size:11.5px;
    line-height:1.7;
    color:var(--text-light);
    letter-spacing:.2px;
  }
  .alt b{color:var(--green-deep);font-weight:600;}

  /* 提示条 */
  .note{
    width:100%;
    margin-top:12px;
    background:#fff;
    border-left:3px solid var(--green);
    border-radius:10px;
    padding:11px 13px;
    font-size:11.5px;
    line-height:1.7;
    color:var(--text-light);
    box-shadow:0 4px 10px rgba(47,157,240,.06);
  }
  .note b{color:var(--green-deep);font-weight:600;}

  /* ============ 返回按钮 ============ */
  .back-wrap{width:100%;text-align:center;margin-top:18px;}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:10px 22px;
    background:#fff;
    color:#1fa873;
    border:1.5px solid #2ebd85;
    border-radius:999px;
    font-size:13.5px;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 4px 12px rgba(46,158,107,.12);
    transition:transform .15s,background .25s,color .25s,box-shadow .25s;
    touch-action:manipulation;
    user-select:none;
    -webkit-user-select:none;
  }
  .back-btn:active{transform:scale(.96);}
  @media (hover:hover){
    .back-btn:hover{background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(47,157,240,.3);}

  /* ============ 底部版权 ============ */
  footer{
    width:100%;
    margin-top:22px;
    text-align:center;
    font-size:12px;
    color:#a8bcb4;
    letter-spacing:1px;
  }

  @media (max-width:360px){
    .title-card h1{font-size:19px;letter-spacing:1px;}
    .sel-row{grid-template-columns:1fr;}
    .sel{font-size:14px;padding:11px 30px 11px 13px;}
    .t-name{font-size:15px;}

/* 教练微信号提示框 */

.coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,#35d29a,#2f9df0);color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);transition:opacity .2s ease,transform .2s ease,visibility .2s}
.coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#2f9df0}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
</style>

/* ================= 渲染逻辑（一般无需修改） ================= */
var STAGES = ["小学", "初中", "高中"];
var DEFAULT_SUBJECT = "数学";   /* ★ 默认选中的学科（切换学段后同样回到该学科）★ */

/* 按名称定位默认学科下标；若该学段没有此学科则退回第一个 */
function defaultSubjectIndex(stage){
  var subs = DATA[stage] || [];
  for (var i = 0; i < subs.length; i++) {
    if (subs[i].name === DEFAULT_SUBJECT) return i;
  }
  return 0;
}

var state = { stage: STAGES[0], subject: defaultSubjectIndex(STAGES[0]) };

var stageSelEl = document.getElementById("stageSel");
var subjSelEl = document.getElementById("subjSel");
var infoEl = document.getElementById("info");
var listEl = document.getElementById("list");
var statsEl = document.getElementById("stats");
var noteEl = document.getElementById("note");

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function linkHtml(label, uid){
  return '<a class="t-link" href="https://space.bilibili.com/' + esc(uid) +
         '" target="_blank" rel="noopener noreferrer">🔗 ' + esc(label) + '</a>';
}
function altHtml(s){
  /* 备选行内允许 <b> 高亮；括号里的纯数字自动变主页链接 */
  var out = esc(s).replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");
  return out.replace(/(\d{5,})/g, function(_, uid){
    return '<a href="https://space.bilibili.com/' + uid +
           '" target="_blank" rel="noopener noreferrer" style="color:#1fa873;font-weight:600;text-decoration:none">' + uid + '</a>';
  });
}

/* 首屏统计 */
function buildStats(){
  var sc = 0, tc = 0, uids = {};
  STAGES.forEach(function(s){
    DATA[s].forEach(function(sub){
      sc++;
      sub.teachers.forEach(function(t){ tc++; uids[t.u] = 1; });
      var m = (sub.alt || "").match(/\d{5,}/g);
      if (m) m.forEach(function(u){ uids[u] = 1; });
    });
  });
  statsEl.innerHTML =
    '<div><b>' + STAGES.length + '</b><span>学段</span></div>' +
    '<div><b>' + sc + '</b><span>学科格</span></div>' +
    '<div><b>' + Object.keys(uids).length + '</b><span>已核实主页</span></div>';
}

/* 学段下拉 */
function buildStageSelect(){
  stageSelEl.innerHTML = "";
  STAGES.forEach(function(s){
    var o = document.createElement("option");
    o.value = s;
    o.textContent = s;
    o.selected = (s === state.stage);
    stageSelEl.appendChild(o);
  });
  stageSelEl.value = state.stage;
}

/* 学科下拉 */
function buildSubjectSelect(){
  subjSelEl.innerHTML = "";
  DATA[state.stage].forEach(function(sub, i){
    var o = document.createElement("option");
    o.value = i;
    o.textContent = sub.icon + "  " + sub.name;
    o.selected = (i === state.subject);
    subjSelEl.appendChild(o);
  });
  subjSelEl.value = String(state.subject);
}

/* 内容区 */
function renderList(){
  var sub = DATA[state.stage][state.subject];
  infoEl.innerHTML = "当前：<b>" + esc(state.stage) + "</b> · <b>" + esc(sub.name) +
                     "</b> · 主推 <b>" + sub.teachers.length + "</b> 位";
  listEl.innerHTML = "";
  sub.teachers.forEach(function(t, i){
    var card = document.createElement("div");
    card.className = "teacher";
    card.style.animationDelay = (i * 60) + "ms";
    card.innerHTML =
      '<div class="t-head"><span class="t-rank">' + (i + 1) + '</span>' +
      '<span class="t-name">' + esc(t.n) + '</span></div>' +
      '<div class="t-desc">' + esc(t.d) + '</div>' +
      linkHtml("打开 B 站主页", t.u);
    listEl.appendChild(card);
  });
  if (sub.alt) {
    var box = document.createElement("div");
    box.className = "alt";
    box.innerHTML = altHtml(sub.alt);
    box.style.animationDelay = (sub.teachers.length * 60) + "ms";
    listEl.appendChild(box);
  }
}

function selectStage(s){
  if (!DATA[s]) return;
  state.stage = s;
  state.subject = defaultSubjectIndex(s);
  stageSelEl.value = s;
  buildSubjectSelect();
  renderList();
}

function selectSubject(i){
  if (isNaN(i) || !DATA[state.stage][i]) return;
  state.subject = i;
  subjSelEl.value = String(i);
  renderList();
}

/* 通用兜底说明 */
function buildNote(){
  noteEl.innerHTML =
    "<b>使用提示</b><br>" +
    "① 精力有限，一门学科固定 1-2 位老师，频繁换师易乱；② 直接切换至合集与系列观看，按分数段选课：基础弱看同步课本类，中等看题型归纳类，冲刺看压轴命题类；" +
    "③ 看完必须做题，只听不练是最大的坑；④ 建议 1.25 倍速精听并整理错题；⑤ 小学段每天网课控制在 30-40 分钟。" +
    "<br><br><b>兜底资源</b>：国家中小学智慧教育平台（basic.smartedu.cn），教育部官方、全学段全学科、完全免费无广告。" ;
}

stageSelEl.addEventListener("change", function(){ selectStage(stageSelEl.value); });
subjSelEl.addEventListener("change", function(){ selectSubject(parseInt(subjSelEl.value, 10)); });

buildStats();
buildStageSelect();
buildSubjectSelect();
renderList();
buildNote();
</script>
