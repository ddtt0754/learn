<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI学 · 网址导航 - 豆豆智学中心</title>
<style>
:root{
  --bg:#f5f7fa;
  --text:#1e293b;
  --text2:#64748b;
  --grad:linear-gradient(135deg,#35d29a,#2f9df0);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;
  padding:28px 20px 48px;
}
.wrap{width:100%;max-width:600px;}

/* 顶部返回 */
.back-bar{width:100%;max-width:600px;margin-top:22px;text-align:center;}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border:none;border-radius:12px;
  background:#fff;color:var(--text2);font-size:.95rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(15,23,42,.06);
  transition:transform .15s;
  touch-action:manipulation;
}
.back-btn:active{transform:scale(.95);}

/* 标题 */
.head{text-align:center;margin-bottom:34px;}
.title{
  font-size:3rem;font-weight:900;letter-spacing:.16em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.subtitle{font-size:1.05rem;color:var(--text2);margin-top:10px;font-weight:500;}
.subtitle b{margin:0 4px;color:var(--text);}

/* 网址卡片 */
.section-label{font-size:1.05rem;color:var(--text2);margin-bottom:16px;font-weight:600;text-align:center;}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.card{
  background:#fff;border-radius:18px;padding:26px 16px 22px;
  text-align:center;cursor:pointer;text-decoration:none;color:var(--text);
  box-shadow:0 6px 16px rgba(15,23,42,.05);
  border:2px solid #eef2f7;
  transition:transform .15s,border-color .2s,box-shadow .2s;
  user-select:none;
  touch-action:manipulation;
}
.card:active{transform:scale(.95);}
.card .ico{font-size:2.6rem;line-height:1;margin-bottom:12px;}
.card .name{font-size:1.15rem;font-weight:700;word-break:break-word;}
.card .desc{font-size:.82rem;color:var(--text2);margin-top:6px;line-height:1.5;}
.card .tag{
  display:inline-block;margin-top:10px;padding:3px 12px;border-radius:999px;
  background:#e8f7f0;color:#1fa873;font-size:.72rem;font-weight:600;
}
.card .tag.live{
  background:var(--grad);color:#fff;
}

/* 底部说明 */
.tip{margin-top:30px;text-align:center;font-size:.9rem;color:#94a3b8;}
.tip .vip-link{
  display:inline-block;margin:0 2px;padding:2px 9px;border-radius:999px;
  background:#e8f7f0;color:#1fa873;font-weight:600;text-decoration:none;
  white-space:nowrap;line-height:1.6;
  transition:transform .15s,background .15s;
  touch-action:manipulation;
}
.tip .vip-link:active{transform:scale(.95);background:#d9f2e6;}

@media(max-width:480px){
  .title{font-size:2.4rem;}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px;}
  .card{padding:20px 10px 16px;border-radius:14px;}
  .card .ico{font-size:2.1rem;}
  .card .name{font-size:1rem;}
}
/* ========== 手机号验证锁屏 ========== */
.lock-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(15,23,42,.78); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.lock-overlay.hidden { display: none; }
.lock-card {
  background: #fff; border-radius: 20px; padding: 32px 28px 24px;
  width: 340px; max-width: 92vw; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.25); animation: lockIn .35s ease;
}
@keyframes lockIn { from { opacity:0; transform: translateY(20px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
.lock-card .lock-icon { font-size: 48px; margin-bottom: 6px; }
.lock-card h2 { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
.lock-card .lock-desc { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.6; }
.lock-input-row { display: flex; gap: 8px; }
.lock-input-row input {
  flex: 1; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 16px; outline: none; text-align: center; letter-spacing: 2px;
  font-family: inherit; transition: border-color .2s;
}
.lock-input-row input:focus { border-color: #3b82f6; }
.lock-input-row input.error { border-color: #ef4444; background: #fef2f2; animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.lock-input-row button {
  padding: 12px 22px; background: linear-gradient(135deg,#35d29a,#2f9df0);
  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: transform .15s;
}
.lock-input-row button:hover { transform: scale(1.03); }
.lock-input-row button:active { transform: scale(.97); }
.lock-input-row button:disabled { opacity: .5; cursor: not-allowed; }
.lock-loading { display: none; margin-top: 10px; font-size: 12px; color: #64748b; }
.lock-loading.show { display: block; }
.lock-error { display: none; margin-top: 10px; padding: 8px 12px; background: #fef2f2;
  color: #dc2626; border-radius: 8px; font-size: 12px; font-weight: 600; }
.lock-error.show { display: block; }
  .lock-hint { margin-top: 12px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
</style>
</head>
<body>
<!-- 手机号验证锁屏 -->
<div class="lock-overlay" id="lockOverlay">
  <div class="lock-card">
    <div class="lock-icon">🔐</div>
    <h2>请输入手机号验证</h2>
    <div class="lock-desc">首次访问需验证手机号<br>验证通过后可 7 天内免登录</div>
    <div class="lock-input-row">
      <input type="tel" id="phoneInput" placeholder="输入 11 位手机号" maxlength="11" inputmode="numeric" autofocus>
      <button id="verifyBtn" onclick="verifyPhone()">验证</button>
    </div>
    <div class="lock-loading" id="lockLoading">⏳ 正在验证…</div>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-hint">仅限已登记手机号访问<br>如有疑问请联系两英豆豆教练</div>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <h1 class="title">AI学</h1>
    <p class="subtitle">AI 网址导航 <b>·</b> 好用的 AI 学习站</p>
  </div>

  <div class="cards" id="cards"></div>

  <p class="tip">点击卡片即可前往学习 · <a class="vip-link" href="../resources.html">Vip群资料更新</a> · © 2026 两英豆豆教练</p>
</div>

<script>
/* =====================================================================
 * ★ 网址数据区 —— 后期添加 / 修改网站，只需改动这里 ★
 *   ico:  卡片图标（emoji）
 *   name: 网站名称
 *   desc: 一句话简介
 *   url:  网站地址（live 为 true 时点击新窗口打开）
 *   live: true=已上线可访问；false=建设中占位
 *   inner:true=站内页面，同窗口打开（不出新标签页）
 * ===================================================================== */
var SITES = [
  { ico:'🧰', name:'学科AI万能提问模板', desc:'401 条可复制提示词 · 小学 1-6 年级 × 语数英 · 初中 7-9 年级 × 9 科', url:'dd-prompt/index.html', live:true, inner:true },
  { ico:'🌐', name:'OpenMAIC · 互动课堂', desc:'清华开源·一键生成沉浸式 AI 课堂', url:'https://openmaic.io/zh/',            live:true },
  { ico:'💡', name:'AI生成GGB', desc:'可视化教学平台', url:'https://www.ggbzls.cn/', live:true },
  { ico:'🧑‍🏫', name:'AI 智能辅导', desc:'不懂就问，AI 随时答疑讲解',  url:'../dd-teacher/index.html', live:true },
  { ico:'🗣️', name:'AI 口语陪练', desc:'开口练习，AI 陪你对话纠音',  url:'../../learn-english/textbook/3a-unit1-oral.html', live:true},
  { ico:'✍️', name:'AI 作文批改', desc:'提交作文，秒出点评与修改建议', url:'#', live:false }
];
/* ===================================================================== */

var cards = document.getElementById('cards');
SITES.forEach(function(s){
  var a = document.createElement('a');
  a.className = 'card';
  a.href = s.url;
  if(s.live){
    if(!s.inner){ a.target = '_blank'; a.rel = 'noopener'; }
  } else {
    a.addEventListener('click', function(e){ e.preventDefault(); });
  }
  a.innerHTML =
    '<div class="ico">' + s.ico + '</div>' +
    '<div class="name">' + s.name + '</div>' +
    '<div class="desc">' + s.desc + '</div>' +
    '<span class="tag' + (s.live ? ' live' : '') + '">' + (s.live ? (s.inner ? '进入 →' : '访问 ↗') : '建设中') + '</span>';
  cards.appendChild(a);
});
</script>

<a class="back-bar" href="index.html">
  <button class="back-btn" type="button">← 返回主页</button>
</a>
<script>
(function(){
  var overlay = document.getElementById('lockOverlay');
  var phoneInput = document.getElementById('phoneInput');
  var errEl = document.getElementById('lockError');
  var loadEl = document.getElementById('lockLoading');
  var btnEl = document.getElementById('verifyBtn');

  // 有效期 7 天
  var VALID_MS = 7 * 24 * 60 * 60 * 1000;
  var relockTimer = null;

  // Enter 键提交（始终绑定，保证重新锁屏后也能用）
  if (phoneInput) {
    phoneInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') verifyPhone();
    });
  }
  window.verifyPhone = verifyPhone;

  // Check existing session (1 minute)
  var session = null;
  try { session = JSON.parse(localStorage.getItem('phone_session')); } catch(e) {}
  if (session && session.expires && Date.now() < session.expires) {
    if (overlay) overlay.classList.add('hidden');
    scheduleRelock(session.expires);
    return;
  }

  // Show overlay
  if (overlay) overlay.classList.remove('hidden');
  if (phoneInput) phoneInput.focus();

  // SHA-256 hash phone, fetch hash list, compare
  function sha256(str){
    var encoder = new TextEncoder();
    return crypto.subtle.digest('SHA-256', encoder.encode(str))
      .then(function(buf){
        return Array.from(new Uint8Array(buf))
          .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      });
  }

  function verifyPhone(){
    var phone = phoneInput.value.replace(/\s+/g, '');
    if (!phone) { showErr('请输入手机号'); shake(); return; }
    if (!/^1\d{10}$/.test(phone)) { showErr('请输入正确的 11 位手机号'); shake(); return; }

    btnEl.disabled = true;
    loadEl.classList.add('show');
    errEl.classList.remove('show');
    phoneInput.classList.remove('error');

    // 兜底哈希列表：fetch 失败（如本地 file:// 打开）时使用，仅存哈希不存明文
    var FALLBACK_HASHES = [
      '413b7b3d5700ad8a6b296c9d0e7107dbd7280a985c1c695db8646c278e510224',
      '679d49b6e57d426b2af961461512559700b9e4c01aa723f0b71682c5f07b31c3',
      'df225757a3ffcac2bd9643323af99631a53300b439da8ff4a8a41f889ce39704',
      'f33f356f0975feb01468d154687a812a113ffa87ac5091ecc99637a552f033e9',
    ];

    function check(phoneHash, hashes){
      var matched = hashes.some(function(h){ return h === phoneHash; });
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      if (matched) {
        unlock(phone);
      } else {
        showErr('输入有误，请重新输入');
        shake();
      }
    }

    // Hash the input, fetch hash list; fallback to embedded list if fetch fails
    sha256(phone).then(function(phoneHash){
      fetch('jiesuo.html').then(function(r){ return r.text(); }).then(function(text){
        var hashes = text.trim().split(/[\n\r]+/).filter(function(h){ return h.trim(); });
        check(phoneHash, hashes);
      }).catch(function(){
        check(phoneHash, FALLBACK_HASHES);
      });
    }).catch(function(){
      loadEl.classList.remove('show');
      btnEl.disabled = false;
      showErr('设备不支持，请更换浏览器');
    });
  };

  function unlock(phone){
    var now = Date.now();
    var expires = now + VALID_MS;
    localStorage.setItem('phone_session', JSON.stringify({
      phone: phone,
      loginAt: now,
      expires: expires
    }));
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity .4s';
      setTimeout(function(){ overlay.classList.add('hidden'); overlay.style.opacity = '1'; }, 400);
    }
    scheduleRelock(expires);
  }

  // 有效期结束后重新锁屏（页面停留期间也会触发）
  function relock(){
    relockTimer = null;
    try { localStorage.removeItem('phone_session'); } catch(e) {}
    if (!overlay) return;
    phoneInput.value = '';
    errEl.classList.remove('show');
    overlay.classList.remove('hidden');
    overlay.style.opacity = '1';
    overlay.style.transition = 'none';
    if (phoneInput) phoneInput.focus();
  }

  function scheduleRelock(expires){
    if (relockTimer) { clearTimeout(relockTimer); relockTimer = null; }
    var remain = expires - Date.now();
    if (remain <= 0) { relock(); return; }
    relockTimer = setTimeout(relock, remain);
  }

  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
    setTimeout(function(){ errEl.classList.remove('show'); }, 3000);
  }

  function shake(){
    phoneInput.classList.add('error');
    setTimeout(function(){ phoneInput.classList.remove('error'); }, 400);
  }
})();
</script>
</body>
</html>
