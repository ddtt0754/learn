<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>AI学 · 网址导航 - 豆豆智学中心</title>
<style>
:root{
  --bg:#f5f7fa;
  --text:#1e293b;
  --text2:#64748b;
  --grad:linear-gradient(135deg,#35d29a,#2f9df0);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;
  padding:28px 20px 48px;
}
.wrap{width:100%;max-width:720px;}

/* 顶部返回 */
.back-bar{width:100%;max-width:720px;margin-top:22px;text-align:center;}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border:none;border-radius:12px;
  background:#fff;color:var(--text2);font-size:.95rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(15,23,42,.06);
  transition:transform .15s;
  touch-action:manipulation;
}
.back-btn:active{transform:scale(.95);}

/* 标题 */
.head{text-align:center;margin-bottom:34px;}
.title{
  font-size:3rem;font-weight:900;letter-spacing:.16em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.subtitle{font-size:1.05rem;color:var(--text2);margin-top:10px;font-weight:500;}
.subtitle b{margin:0 4px;color:var(--text);}

/* 网址卡片 */
.section-label{font-size:1.05rem;color:var(--text2);margin-bottom:16px;font-weight:600;text-align:center;}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.card{
  background:#fff;border-radius:18px;padding:26px 16px 22px;
  text-align:center;cursor:pointer;text-decoration:none;color:var(--text);
  box-shadow:0 6px 16px rgba(15,23,42,.05);
  border:2px solid #eef2f7;
  transition:transform .15s,border-color .2s,box-shadow .2s;
  user-select:none;
  touch-action:manipulation;
}
.card:active{transform:scale(.95);}
.card .ico{font-size:2.6rem;line-height:1;margin-bottom:12px;}
.card .name{font-size:1.15rem;font-weight:700;word-break:break-word;}
.card .desc{font-size:.82rem;color:var(--text2);margin-top:6px;line-height:1.5;}
.card .tag{
  display:inline-block;margin-top:10px;padding:3px 12px;border-radius:999px;
  background:#e8f7f0;color:#1fa873;font-size:.72rem;font-weight:600;
}
.card .tag.live{
  background:var(--grad);color:#fff;
}

/* 底部说明 */
.tip{margin-top:30px;text-align:center;font-size:.9rem;color:#94a3b8;}
.tip .vip-link{
  display:inline-block;margin:0 2px;padding:2px 9px;border-radius:999px;
  background:#e8f7f0;color:#1fa873;font-weight:600;text-decoration:none;
  white-space:nowrap;line-height:1.6;
  transition:transform .15s,background .15s;
  touch-action:manipulation;
}
.tip .vip-link:active{transform:scale(.95);background:#d9f2e6;}

@media(max-width:480px){
  .title{font-size:2.4rem;}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px;}
  .card{padding:20px 10px 16px;border-radius:14px;}
  .card .ico{font-size:2.1rem;}
  .card .name{font-size:1rem;}
}
/* ========== 手机号或学号验证锁屏 ========== */
.lock-overlay {
  position: fixed; z-index: 9999;
  top: 0; left: 0; right: 0; bottom: 0;   /* 兼容老内核（等价 inset:0） */
  width: 100%;
  height: 100dvh;                          /* 动态视口；不支持时自动忽略，回落到 top/bottom */
  background: rgba(15,23,42,.78);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  touch-action: none; overscroll-behavior: none;   /* 挡住底层滚动与捏合 */
  font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
.lock-overlay.hidden { display: none; }
.lock-card {
  background: #fff; border-radius: 20px; padding: 32px 28px 24px;
  width: 340px; max-width: 92vw; text-align: center;
  box-shadow: 0 24px 60px rgba(0,0,0,.25); animation: lockIn .35s ease;
}
@keyframes lockIn { from { opacity:0; transform: translateY(20px) scale(.96); } to { opacity:1; transform: translateY(0) scale(1); } }
.lock-card .lock-icon { font-size: 48px; margin-bottom: 6px; }
.lock-card h2 { font-size: 18px; font-weight: 800; color: #1e293b; margin-bottom: 6px; }
.lock-card .lock-desc { font-size: 12px; color: #94a3b8; margin-bottom: 18px; line-height: 1.6; }
.lock-input-row { display: flex; gap: 8px; }
.lock-input-row input {
  flex: 1; padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 12px;
  font-size: 16px; outline: none; text-align: center; letter-spacing: 2px;
  font-family: inherit; transition: border-color .2s;
}
.lock-input-row input:focus { border-color: #3b82f6; }
.lock-input-row input.error { border-color: #ef4444; background: #fef2f2; animation: shake .4s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.lock-input-row button {
  padding: 12px 22px; background: linear-gradient(135deg,#35d29a,#2f9df0);
  color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
  cursor: pointer; white-space: nowrap; transition: transform .15s;
}
.lock-input-row button:hover { transform: scale(1.03); }
.lock-input-row button:active { transform: scale(.97); }
.lock-input-row button:disabled { opacity: .5; cursor: not-allowed; }
.lock-loading { display: none; margin-top: 10px; font-size: 12px; color: #64748b; }
.lock-loading.show { display: block; }
.lock-error { display: none; margin-top: 10px; padding: 8px 12px; background: #fef2f2;
  color: #dc2626; border-radius: 8px; font-size: 12px; font-weight: 600; }
.lock-error.show { display: block; }
  .lock-hint { margin-top: 12px; font-size: 11px; color: #94a3b8; line-height: 1.6; }
</style>

<script>
(function(){
  var overlay = document.getElementById('lockOverlay');
  var phoneInput = document.getElementById('phoneInput');
  var errEl = document.getElementById('lockError');
  var loadEl = document.getElementById('lockLoading');
  var btnEl = document.getElementById('verifyBtn');

  // 有效期 7 天
  var VALID_MS = 7 * 24 * 60 * 60 * 1000;
  var relockTimer = null;

  // Enter 键提交（始终绑定，保证重新锁屏后也能用）
  if (phoneInput) {
    phoneInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter') verifyPhone();
    });
  }
  window.verifyPhone = verifyPhone;

  // Check existing session (1 minute)
  var session = null;
  try { session = JSON.parse(localStorage.getItem('phone_session')); } catch(e) {}
  if (session && session.expires && Date.now() < session.expires) {
    if (overlay) overlay.classList.add('hidden');
    scheduleRelock(session.expires);
    return;
  }

  // Show overlay
  if (overlay) overlay.classList.remove('hidden');
  if (phoneInput) setTimeout(function(){
    try { phoneInput.focus({ preventScroll: true }); } catch(e) { phoneInput.focus(); }
  }, 350);
  pinOverlay();   // 开屏即对齐视觉视口

  // SHA-256 hash phone, fetch hash list, compare
  /* ---- 纯 JS SHA-256（兜底，仅在 crypto.subtle 不可用时启用） ----
   * 手机常常通过 http://192.168.x.x 访问：那不是「安全上下文」，
   * crypto.subtle 为 undefined。原实现会在这里同步抛 TypeError，
   * 而且异常在函数体内抛出、外层 .catch 接不住 →
   * 表现为点「验证」没反应、⏳ 一直转、锁屏永不关闭。
   * 这里改为「能用原生就用，否则降级纯 JS」，两者结果完全一致（SHA-256 十六进制）。
   */
  var SHA256_K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  function sha256Rotr(x, n){ return (x >>> n) | (x << (32 - n)); }
  function sha256Hex(str){
    var bytes = [];
    for (var i = 0; i < str.length; i++) {
      var c = str.charCodeAt(i);
      if (c < 0x80) bytes.push(c);
      else if (c < 0x800) { bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else { bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
    }
    var bitLen = bytes.length * 8;
    bytes.push(0x80);
    while (bytes.length % 64 !== 56) bytes.push(0);
    bytes.push(0, 0, 0, 0, (bitLen >>> 24) & 255, (bitLen >>> 16) & 255, (bitLen >>> 8) & 255, bitLen & 255);

    var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
    var W = new Array(64);
    for (var off = 0; off < bytes.length; off += 64) {
      for (var t = 0; t < 16; t++) {
        W[t] = (bytes[off + t * 4] << 24) | (bytes[off + t * 4 + 1] << 16)
             | (bytes[off + t * 4 + 2] << 8) | bytes[off + t * 4 + 3];
      }
      for (t = 16; t < 64; t++) {
        var s0 = sha256Rotr(W[t-15], 7) ^ sha256Rotr(W[t-15], 18) ^ (W[t-15] >>> 3);
        var s1 = sha256Rotr(W[t-2], 17) ^ sha256Rotr(W[t-2], 19) ^ (W[t-2] >>> 10);
        W[t] = (W[t-16] + s0 + W[t-7] + s1) | 0;
      }
      var a = H[0], b = H[1], c2 = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
      for (t = 0; t < 64; t++) {
        var S1 = sha256Rotr(e, 6) ^ sha256Rotr(e, 11) ^ sha256Rotr(e, 25);
        var ch = (e & f) ^ (~e & g);
        var t1 = (h + S1 + ch + SHA256_K[t] + W[t]) | 0;
        var S0 = sha256Rotr(a, 2) ^ sha256Rotr(a, 13) ^ sha256Rotr(a, 22);
        var maj = (a & b) ^ (a & c2) ^ (b & c2);
        var t2 = (S0 + maj) | 0;
        h = g; g = f; f = e; e = (d + t1) | 0; d = c2; c2 = b; b = a; a = (t1 + t2) | 0;
      }
      H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c2) | 0; H[3] = (H[3] + d) | 0;
      H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
    }
    var hex = '';
    for (i = 0; i < 8; i++) hex += ('00000000' + (H[i] >>> 0).toString(16)).slice(-8);
    return hex;
  }

  function sha256(str){
    try {
      if (window.crypto && window.crypto.subtle && window.TextEncoder) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
          .then(function(buf){
            return Array.from(new Uint8Array(buf))
              .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
          });
      }
    } catch (e) { /* 落到纯 JS 兜底 */ }
    return Promise.resolve(sha256Hex(str));
  }

  /* --------------------------------------------------------------
   * 验号（L1 + L2）
   *  · 纯 JS SHA-256 兜底，非安全上下文也能算哈希
   *  · 8 秒「网络较慢」提示、20 秒硬超时 —— 绝不允许永久卡在「正在验证」
   *  · 失败一律给具体原因（账号不存在 / 学科未授权 / 到期 / 服务异常），并恢复按钮
   * -------------------------------------------------------------- */
  var slowTimer = null, hardTimer = null;
  function clearVerifyTimers(){
    if (slowTimer) { clearTimeout(slowTimer); slowTimer = null; }
    if (hardTimer) { clearTimeout(hardTimer); hardTimer = null; }
  }
  function finishVerify(msg){
    clearVerifyTimers();
    if (loadEl) loadEl.classList.remove('show');
    if (btnEl) btnEl.disabled = false;
    if (msg) { showErr(msg); shake(); }
  }

  function verifyPhone(){
    var phone = (phoneInput && phoneInput.value ? phoneInput.value : '').replace(/\s+/g, '');
    if (!phone) { showErr('请输入手机号或学号'); shake(); return; }
    if (!/^[A-Za-z0-9]{4,24}$/.test(phone)) { showErr('请输入正确的手机号或学号'); shake(); return; }

    btnEl.disabled = true;
    loadEl.textContent = '⏳ 正在验证，约需 5 秒…';
    loadEl.classList.add('show');
    errEl.classList.remove('show');
    phoneInput.classList.remove('error');

    clearVerifyTimers();
    slowTimer = setTimeout(function(){
      if (btnEl.disabled) loadEl.textContent = '⏳ 网络较慢，仍在验证…';
    }, 8000);
    hardTimer = setTimeout(function(){
      if (btnEl.disabled) finishVerify('网络较慢，请检查网络后重试');
    }, 20000);

    // 兜底哈希列表：**仅本地 file:// 打开时生效**，线上（http/https）一律禁用；
    // 防止「屏蔽验号域名 → fetch 失败 → 命中兜底」绕过云端授权校验。仅存哈希不存明文。
    var FALLBACK_HASHES = [
      '413b7b3d5700ad8a6b296c9d0e7107dbd7280a985c1c695db8646c278e510224',
    ];
    var IS_LOCAL_FILE = (location.protocol === 'file:');

    function check(phoneHash, hashes){
      var matched = hashes.some(function(h){ return h === phoneHash; });
      if (matched) { unlock(phone); return; }
      finishVerify('输入有误，请重新输入');
    }

    // 云端不可达 / 网关异常（非 2xx，如欠费 403 / 5xx）时的处置：
    // **只有本地 file:// 打开才走兜底名单**；线上（http/https）一律拒绝并提示。
    function fallbackOrFail(phoneHash){
      if (IS_LOCAL_FILE) { check(phoneHash, FALLBACK_HASHES); return; }
      finishVerify('验证服务暂时不可用，请检查网络后重试');
    }

    var WORKER_URL = 'https://doudou-unlock-lkepopyncq.cn-hangzhou.fcapp.run';
    var PAGE_PATH  = '/learn/ai/ai_learn.html';
    // 云端改表 / 实例切换的瞬间可能读不到最新授权：对「查不到」类结论静默重试一次，
    // 避免把瞬时的数据不一致误报成「学科未授权」。
    function verifyOnce(phoneHash, retried){
      fetch(WORKER_URL + '?hash=' + phoneHash + '&page=' + encodeURIComponent(PAGE_PATH), { cache: 'no-store' })
        .then(function(r){
          if (!r.ok) throw new Error('http_' + r.status);
          return r.json();
        })
        .then(function(data){
          if (data && data.ok) { check(phoneHash, [phoneHash]); return; }
          if (!data || (data.ok === undefined && data.reason === undefined)) {
            fallbackOrFail(phoneHash);
            return;
          }
          var reason = data.reason;
          if (!retried && (reason === 'not_found' || reason === 'no_page' || reason === 'no_module' || reason === 'module_unknown')) {
            setTimeout(function(){ verifyOnce(phoneHash, true); }, 800);
            return;
          }
          var msg = '输入有误，请重新输入';
          if (reason === 'not_found') { msg = '账号不存在，请重新输入或联系豆豆教练添加'; }
          else if (reason === 'no_page' || reason === 'no_module') { msg = '学科未授权，请联系豆豆教练开通授权'; }
          else if (reason === 'expired') { msg = '授权已到期，请联系豆豆教练续期'; }
          else if (reason === 'module_unknown') { msg = '服务暂时不可用，请稍后再试'; }
          finishVerify(msg);
        })
        .catch(function(){ fallbackOrFail(phoneHash); });
    }

    try {
      sha256(phone).then(function(phoneHash){
        verifyOnce(phoneHash, false);
      }).catch(function(){ finishVerify('验证失败，请重试'); });
    } catch (e) {
      // 兜底：绝不让按钮卡在「正在验证」，否则用户会一直停在锁屏
      finishVerify('验证失败，请重试');
    }
  }

  function unlock(phone){
    clearVerifyTimers();
    var now = Date.now();
    var expires = now + VALID_MS;
    try {
      localStorage.setItem('phone_session', JSON.stringify({
        phone: phone,
        loginAt: now,
        expires: expires
      }));
    } catch (e) { /* iframe 内第三方存储被浏览器禁用时忽略：本次照常放行，只是下次需重验 */ }
    if (overlay) {
      overlay.style.opacity = '0';
      overlay.style.transition = 'opacity .4s';
      setTimeout(function(){ overlay.classList.add('hidden'); overlay.style.opacity = '1'; clearPin(); }, 400);
    }
    scheduleRelock(expires);
  }

  // 有效期结束后重新锁屏（页面停留期间也会触发）
  function relock(){
    relockTimer = null;
    try { localStorage.removeItem('phone_session'); } catch(e) {}
    if (!overlay) return;
    phoneInput.value = '';
    errEl.classList.remove('show');
    overlay.classList.remove('hidden');
    overlay.style.opacity = '1';
    overlay.style.transition = 'none';
    pinOverlay();
    if (phoneInput) { try { phoneInput.focus({ preventScroll: true }); } catch(e) { phoneInput.focus(); } }
  }

  function scheduleRelock(expires){
    if (relockTimer) { clearTimeout(relockTimer); relockTimer = null; }
    var remain = expires - Date.now();
    if (remain <= 0) { relock(); return; }
    relockTimer = setTimeout(relock, remain);
  }

  function showErr(msg){
    errEl.textContent = msg;
    errEl.classList.add('show');
    setTimeout(function(){ errEl.classList.remove('show'); }, 3000);
  }

  function shake(){
    phoneInput.classList.add('error');
    setTimeout(function(){ phoneInput.classList.remove('error'); }, 400);
  }

  /* ==================================================================
   * ★ 钉住「视觉视口」——修复手机 Chrome 锁屏只盖住一部分屏幕
   *   根因：.lock-overlay 用 position:fixed，其盒子只认「布局视口」
   *        (layout viewport)；而手机 Chrome 会忽略 user-scalable=no，
   *        用户一旦缩放，视觉视口就小于布局视口，遮罩四周便露出底页。
   *   做法：用 visualViewport 把遮罩的宽高与偏移钉到实际可见区。
   *        不支持 visualViewport 的内核由 CSS 的 100dvh 兜底，JS 静默跳过。
   * ================================================================== */
  function pinOverlay(){
    if (!overlay || !window.visualViewport) return;
    var vv = window.visualViewport;
    overlay.style.width     = vv.width  + 'px';
    overlay.style.height    = vv.height + 'px';
    overlay.style.transform = 'translate(' + vv.offsetLeft + 'px,' + vv.offsetTop + 'px)';
  }
  function clearPin(){
    if (!overlay) return;
    overlay.style.width = '';
    overlay.style.height = '';
    overlay.style.transform = '';
  }
  function isLocked(){
    return !!(overlay && !overlay.classList.contains('hidden'));
  }
  if (window.visualViewport) {
    var onViewportChange = function(){ if (isLocked()) pinOverlay(); };
    window.visualViewport.addEventListener('resize', onViewportChange);
    window.visualViewport.addEventListener('scroll', onViewportChange);
    window.addEventListener('orientationchange', function(){ setTimeout(onViewportChange, 250); });
  }
})();
</script>
</body>
</html>
