<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>学AI · 网址导航 - 豆豆智学中心</title>
<style>
:root{
  --bg:#f5f7fa;
  --text:#1e293b;
  --text2:#64748b;
  --grad:linear-gradient(135deg,#35d29a,#2f9df0);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;
  padding:28px 20px 48px;
}
.wrap{width:100%;max-width:620px;}

/* 顶部返回 */
.back-bar{width:100%;max-width:620px;margin-bottom:18px;}
.back-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 18px;border:none;border-radius:12px;
  background:#fff;color:var(--text2);font-size:.95rem;cursor:pointer;
  box-shadow:0 4px 12px rgba(15,23,42,.06);
  transition:transform .15s;
  touch-action:manipulation;
}
.back-btn:active{transform:scale(.95);}

/* 标题 */
.head{text-align:center;margin-bottom:30px;}
.title{
  font-size:3rem;font-weight:900;letter-spacing:.16em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
.subtitle{font-size:1.05rem;color:var(--text2);margin-top:10px;font-weight:500;}
.subtitle b{margin:0 4px;color:var(--text);}

/* 分组 */
.group{margin-bottom:28px;}
.group-title{
  display:flex;align-items:center;gap:6px;
  font-size:1.05rem;font-weight:700;color:var(--text);
  margin-bottom:12px;
}
.group-title::before{
  content:"";width:5px;height:18px;border-radius:3px;
  background:var(--grad);margin-right:2px;
}

/* 网址卡片 */
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.card{
  background:#fff;border-radius:16px;padding:20px 12px 16px;
  text-align:center;cursor:pointer;text-decoration:none;color:var(--text);
  box-shadow:0 6px 16px rgba(15,23,42,.05);
  border:2px solid #eef2f7;
  transition:transform .15s,border-color .2s,box-shadow .2s;
  user-select:none;
  touch-action:manipulation;
}
.card:active{transform:scale(.95);}
.card .ico{font-size:2.3rem;line-height:1;margin-bottom:10px;}
.card .name{font-size:1.05rem;font-weight:700;word-break:break-word;}
.card .desc{font-size:.78rem;color:var(--text2);margin-top:5px;line-height:1.5;}
.card .tag{
  display:inline-block;margin-top:10px;padding:3px 12px;border-radius:999px;
  background:var(--grad);color:#fff;font-size:.72rem;font-weight:600;
}

/* 底部说明 */
.tip{margin-top:30px;text-align:center;font-size:.9rem;color:#94a3b8;}

@media(max-width:480px){
  .title{font-size:2.4rem;}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px;}
  .card{padding:18px 8px 14px;border-radius:14px;}
  .card .ico{font-size:2rem;}
  .card .name{font-size:.98rem;}
}
</style>
</head>
<body>
<a class="back-bar" href="index.html">
  <button class="back-btn" type="button">← 返回主页</button>
</a>
<div class="wrap">

    <h1 class="title">学AI</h1>

  </div>

  <div id="groups"></div>

  <p class="tip">点击卡片即可前往 · 持续更新 · © 2026 两英豆豆教练</p>
</div>

<script>

/* ===================================================================== */

var groupsEl = document.getElementById('groups');
GROUPS.forEach(function(g){
  var sec = document.createElement('section');
  sec.className = 'group';

  var h = document.createElement('div');
  h.className = 'group-title';
  h.innerHTML = g.ico + ' ' + g.title;
  sec.appendChild(h);

  var c = document.createElement('div');
  c.className = 'cards';
  g.sites.forEach(function(s){
    var a = document.createElement('a');
    a.className = 'card';
    a.href = s.url;
    if(!s.local){
      a.target = '_blank';
      a.rel = 'noopener';
    }
    a.innerHTML =
      '<div class="ico">' + s.ico + '</div>' +
      '<div class="name">' + s.name + '</div>' +
      '<div class="desc">' + s.desc + '</div>' +
      '<span class="tag">' + (s.local ? '进入 →' : '访问 ↗') + '</span>';
    c.appendChild(a);
  });
  sec.appendChild(c);
  groupsEl.appendChild(sec);
});
</script>
</body>
</html>
