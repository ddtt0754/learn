<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2ebd85">
<title>1–9 年级阅读规划 · 豆豆智学</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --green:#2ebd85; --deep:#1fa873; --blue:#2f9df0;
    --text:#33434b; --text2:#5c6f68; --muted:#8aa09a; --line:#e6f2ec;
    --card:#fff; --shadow:0 8px 22px rgba(47,157,240,.10); --radius:16px;
    --grad:linear-gradient(135deg,#35d29a,#2f9df0);
  }
  html{scroll-behavior:smooth;}
  body{
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    background:linear-gradient(180deg,#eefaf4 0%,#eef4fb 100%);
    color:var(--text); display:flex; justify-content:center; align-items:flex-start;
    padding:24px 16px calc(40px + env(safe-area-inset-bottom)); min-height:100vh;
  }
  .container{width:100%;max-width:860px;display:flex;flex-direction:column;}

  /* ============ 标题卡 ============ */
  .title-card{position:relative;width:100%;background:var(--grad);border-radius:22px;
    padding:28px 20px 24px;text-align:center;color:#fff;overflow:hidden;
    box-shadow:0 14px 30px rgba(47,157,240,.25);}
  .title-card::before,.title-card::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);}
  .title-card::before{width:120px;height:120px;top:-40px;right:-30px;}
  .title-card::after{width:70px;height:70px;bottom:-24px;left:-16px;}
  .title-card h1{position:relative;font-size:22px;letter-spacing:2px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.12);}
  .title-card .sub{position:relative;margin-top:9px;font-size:13px;letter-spacing:3px;opacity:.92;}
  .title-card .src{position:relative;margin-top:10px;font-size:10.5px;letter-spacing:.5px;opacity:.75;}

  /* ============ 数据条 ============ */
  .stats{width:100%;margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .stats div{background:#fff;border-radius:12px;padding:10px 2px;text-align:center;box-shadow:0 4px 10px rgba(47,157,240,.06);}
  .stats b{display:block;font-size:17px;font-weight:700;color:var(--deep);letter-spacing:.2px;}
  .stats span{font-size:10.5px;color:var(--muted);letter-spacing:.3px;}

  /* ============ 吸顶导航 ============ */
  .sticky{position:sticky;top:0;z-index:30;width:100%;padding:10px 0 8px;margin-top:12px;
    background:rgba(242,249,249,.95);
    -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
    box-shadow:0 8px 16px -14px rgba(47,157,240,.55);}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:none;font-size:12.5px;padding:7px 13px;border-radius:999px;background:#fff;color:var(--text);
    border:1.5px solid var(--line);cursor:pointer;font-weight:600;white-space:nowrap;
    font-family:inherit;touch-action:manipulation;transition:transform .15s,background .2s,color .2s;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(47,157,240,.26);}

  /* ============ 区块标题 ============ */
  .sec{margin-top:24px;scroll-margin-top:62px;}
  .sec-h{display:flex;align-items:baseline;gap:9px;margin:0 2px 11px;}
  .sec-h i{width:4px;height:15px;border-radius:2px;background:var(--grad);align-self:center;flex:none;}
  .sec-h h2{font-size:15.5px;font-weight:800;letter-spacing:1px;}
  .sec-h em{font-style:normal;font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-left:auto;}

  /* ============ 总览 · 阅读量阶梯 ============ */
  .ladder{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px 6px;}
  .lad{padding:9px 0;border-bottom:1px dashed #eef3f1;}
  .lad:last-child{border-bottom:0;}
  .lad-top{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .lad-no{flex:none;width:22px;height:22px;border-radius:7px;background:var(--grad);color:#fff;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .lad-g{font-size:13px;font-weight:700;letter-spacing:.5px;}
  .lad-w{margin-left:auto;font-size:12px;font-weight:700;color:var(--deep);}
  .lad-w em{font-style:normal;font-size:10px;font-weight:600;color:var(--muted);margin-left:2px;}
  .lad-bar{height:6px;border-radius:99px;background:#eef4f2;overflow:hidden;}
  .lad-bar i{display:block;height:100%;border-radius:99px;background:var(--grad);min-width:6px;}
  .lad-cn{font-size:11.5px;color:var(--text2);margin-top:6px;line-height:1.6;}
  .lad-en{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.6;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;}
  .lex{flex:none;font-size:10px;font-weight:700;color:#1d7fc4;background:#eef7fe;border-radius:99px;padding:2px 7px;}

  /* ============ 原则 · 时间轴 ============ */
  .tl{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 16px 6px;}
  .tl-row{position:relative;padding:0 0 16px 22px;border-left:2px solid #eef4f2;margin-left:4px;}
  .tl-row:last-child{border-left-color:transparent;padding-bottom:4px;}
  .tl-row::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;
    background:#fff;border:2.5px solid var(--green);}
  .tl-stage{font-size:11.5px;font-weight:800;color:var(--deep);letter-spacing:1px;}
  .tl-main{font-size:12.5px;color:var(--text);font-weight:600;margin-top:3px;line-height:1.6;}
  .tl-task{font-size:11.5px;color:var(--text2);margin-top:3px;line-height:1.75;}

  /* ============ 原则 · 英语三阶梯 ============ */
  .rules{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-top:12px;}
  .rule{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed #eef3f1;}
  .rule:last-of-type{border-bottom:0;}
  .rule-tag{flex:none;min-width:56px;font-size:10.5px;font-weight:800;color:#1d7fc4;background:#eef7fe;
    border-radius:8px;padding:5px 8px;line-height:1.35;text-align:center;letter-spacing:.2px;}
  .rule p{font-size:12.5px;color:var(--text2);line-height:1.8;}
  .rule p b{color:var(--text);font-weight:700;}
  .dual{font-size:11.5px;color:var(--text2);line-height:1.8;margin-top:10px;padding:10px 12px;
    background:#f7fdfa;border-radius:10px;border-left:3px solid var(--green);}
  .dual b{color:var(--deep);}

  /* ============ 时间配比 · 环形 ============ */
  .donuts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .dn{background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:14px 10px 12px;text-align:center;}
  .dn-ring{width:84px;height:84px;border-radius:50%;margin:0 auto 9px;position:relative;
    display:flex;align-items:center;justify-content:center;}
  .dn-ring::before{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%;}
  .dn-ring span{position:relative;font-size:11px;font-weight:800;color:var(--deep);line-height:1.3;letter-spacing:.2px;}
  .dn-t{font-size:11.5px;font-weight:700;color:var(--text);letter-spacing:.5px;}
  .dn-d{font-size:10.5px;color:var(--muted);margin-top:4px;line-height:1.6;}
  .dn-note{grid-column:1 / -1;font-size:11.5px;color:var(--text2);line-height:1.8;
    background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:11px 13px;}

  /* ============ 分年级卡 ============ */
  .gcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    position:relative;overflow:hidden;margin-top:12px;}
  .gcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad);}
  .ghead{display:flex;align-items:center;gap:10px;padding:13px 15px 11px 18px;
    border-bottom:1px dashed #eef3f1;background:linear-gradient(135deg,rgba(53,210,154,.05),rgba(47,157,240,.05));}
  .gno{flex:none;width:30px;height:30px;border-radius:10px;background:var(--grad);color:#fff;
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.5px;}
  .ghead h3{font-size:15px;font-weight:800;letter-spacing:.6px;}
  .ghead p{font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.3px;}
  .gbody{padding:12px 15px 14px 18px;display:flex;flex-direction:column;gap:10px;}
  .blk{border-radius:12px;padding:11px 12px 12px;}
  .blk.cn{background:#f7fdfa;border:1px solid #e7f6ef;}
  .blk.en{background:#f6fafe;border:1px solid #e4f0fb;}
  .blk-h{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:1.2px;}
  .blk.cn .blk-h{color:var(--deep);}
  .blk.en .blk-h{color:#1d7fc4;}
  .blk-h .dot{width:6px;height:6px;border-radius:50%;flex:none;}
  .blk.cn .dot{background:var(--green);}
  .blk.en .dot{background:var(--blue);}
  .blk-h .note{font-size:10px;font-weight:600;letter-spacing:0;color:var(--muted);margin-left:auto;}

  .ph{display:flex;align-items:baseline;gap:6px;margin-top:10px;}
  .ph .k{font-size:11px;font-weight:800;color:#7d938c;letter-spacing:.8px;}
  .blk.en .ph .k{color:#7f9cb0;}
  .ph .cnt{font-size:10px;font-weight:700;color:var(--deep);background:#eafaf2;border-radius:99px;padding:2px 7px;}
  .blk.en .ph .cnt{color:#1d7fc4;background:#eaf4fe;}
  .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .pills span{font-size:11.5px;line-height:1.45;padding:3px 8px;border-radius:7px;letter-spacing:.1px;}
  .pills.b span{background:#eafaf2;color:#177a55;}
  .blk.en .pills.b span{background:#eaf4fe;color:#1a6ea8;}

  .kv{margin-top:10px;}
  .kv .k{font-size:11px;font-weight:800;color:#7d938c;letter-spacing:.8px;}
  .blk.en .kv .k{color:#7f9cb0;}
  .kv p{font-size:12px;color:var(--text2);line-height:1.85;margin-top:3px;}
  .kv p b{color:var(--text);font-weight:700;}
  .kv p em{font-style:normal;color:#2b5f8a;font-weight:600;}

  /* ============ 附表 ============ */
  details.acc{background:#fff;border-radius:14px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden;}
  details.acc>summary{list-style:none;cursor:pointer;padding:13px 15px;font-size:12.5px;font-weight:700;
    display:flex;align-items:center;gap:8px;letter-spacing:.4px;touch-action:manipulation;}
  details.acc>summary::-webkit-details-marker{display:none;}
  details.acc>summary .idx{flex:none;width:20px;height:20px;border-radius:6px;background:#eafaf2;color:var(--deep);
    font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  details.acc>summary .arw{margin-left:auto;color:var(--deep);font-weight:800;transition:transform .2s;}
  details.acc[open]>summary .arw{transform:rotate(180deg);}
  details.acc[open]>summary{border-bottom:1px dashed #eef3f1;}
  .acc-body{padding:6px 15px 14px;}

  .arow{display:block;padding:9px 0;border-bottom:1px dashed #f1f6f4;}
  .arow:last-child{border-bottom:0;}
  .arow-h{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
  .ano{flex:none;width:20px;height:20px;border-radius:6px;background:var(--grad);color:#fff;font-size:10px;
    font-weight:700;display:flex;align-items:center;justify-content:center;}
  .acnt{flex:none;font-size:10px;font-weight:700;color:var(--deep);background:#eafaf2;border-radius:99px;
    padding:2px 7px;}
  .atxt{font-size:11.5px;color:var(--text2);line-height:1.85;}
  .atxt em{font-style:normal;color:var(--text);font-weight:600;}

  .brow{display:flex;gap:8px;align-items:baseline;padding:7px 0;border-bottom:1px dashed #f1f6f4;}
  .brow:last-child{border-bottom:0;}
  .bno{flex:none;width:17px;font-size:10px;font-weight:800;color:#b7cbc3;}
  .bname{font-size:12.5px;font-weight:700;color:var(--text);}
  .bmeta{margin-left:auto;flex:none;font-size:10.5px;color:var(--muted);letter-spacing:.2px;}

  .crow{padding:8px 0;border-bottom:1px dashed #f1f6f4;}
  .crow:last-child{border-bottom:0;}
  .crow-h{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
  .crow-h b{font-size:12px;font-weight:700;}
  .crow-h i{font-style:normal;font-size:10px;font-weight:700;color:#1d7fc4;background:#eef7fe;
    border-radius:99px;padding:2px 7px;margin-left:auto;}
  .cchips{display:flex;flex-wrap:wrap;gap:4px;}
  .cchips span{font-size:10.5px;color:var(--text2);background:#f7fbfa;border:1px solid #eaf3f0;
    border-radius:6px;padding:2px 6px;line-height:1.5;}

  .drow{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed #f1f6f4;}
  .drow:last-child{border-bottom:0;}
  .dtype{flex:none;font-size:10.5px;font-weight:800;color:#fff;background:var(--grad);
    border-radius:8px;padding:4px 8px;letter-spacing:.3px;}
  .dbody{flex:1;min-width:0;}
  .dbody .dl{font-size:10.5px;color:var(--muted);margin-bottom:2px;}
  .dbody p{font-size:11.5px;color:var(--text2);line-height:1.7;}
  .dbody p em{font-style:normal;color:var(--text);font-weight:600;}
  .dbody .dy{font-size:10.5px;color:var(--deep);font-weight:700;margin-top:3px;}

  .acc-note{font-size:10.5px;color:var(--muted);line-height:1.8;padding:9px 12px;background:#f7fbfa;
    border-radius:9px;margin-top:8px;}

  /* ============ 执行建议 ============ */
  .exe{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 16px 12px;}
  .ex{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed #f1f6f4;}
  .ex:last-child{border-bottom:0;}
  .ex-no{flex:none;width:21px;height:21px;border-radius:50%;border:1.5px solid var(--green);color:var(--deep);
    font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .ex-t{font-size:12.5px;font-weight:800;color:var(--text);letter-spacing:.3px;}
  .ex-d{font-size:11.5px;color:var(--text2);line-height:1.8;margin-top:3px;}

  /* ============ 返回首页 ============ */
  .back-wrap{width:100%;text-align:center;margin:26px auto 2px;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 26px;background:#fff;color:var(--deep);
    border:1.5px solid var(--green);border-radius:14px;font-size:14px;font-weight:700;text-decoration:none;
    box-shadow:0 4px 12px rgba(46,158,107,.12);transition:transform .15s,box-shadow .2s;}
  .back-btn:active{transform:scale(.97);}

  /* ============ 页脚 ============ */
  footer{width:100%;margin-top:22px;text-align:center;font-size:11.5px;color:#a8bcb4;
    letter-spacing:1px;line-height:1.9;padding-top:14px;border-top:1px solid #e6f0ec;}
  .coach-tip{position:relative;display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .coach-tip .tip2{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;
    transform:translateX(-50%) translateY(4px);background:var(--grad);color:#fff;padding:7px 14px;
    border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;letter-spacing:.5px;z-index:99;
    pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);
    transition:opacity .2s ease,transform .2s ease,visibility .2s;}
  .coach-tip .tip2::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:6px solid transparent;border-top-color:#2f9df0;}
  .coach-tip:hover .tip2,.coach-tip:active .tip2,.coach-tip:focus .tip2{
    visibility:visible;opacity:1;transform:translateX(-50%) translateY(0);}

  @media (max-width:360px){
    .title-card h1{font-size:19px;letter-spacing:1px;}
    .stats b{font-size:15px;} .stats span{font-size:9.5px;}
    .dn-ring{width:74px;height:74px;}
    .ghead h3{font-size:14px;}
    .pills span{font-size:11px;}
  }
  @media (hover:hover){
    .chip:hover{border-color:#bfe6d8;}
    .gcard{transition:box-shadow .2s;}
  }
  @media print{
    body{background:#fff;padding:0;}
    .sticky{display:none;}
    .gcard,details.acc,.tl,.rules,.ladder,.exe{box-shadow:none;border:1px solid #e6f0ec;break-inside:avoid;}
    details.acc{page-break-inside:avoid;}
    details.acc>summary .arw{display:none;}
  }
</style>
</head>
<body>
<div class="container">

  <header class="title-card">
    <h1>📖 1–9 年级阅读规划</h1>
    <div class="sub">中文 · 英语 双线并进</div>
  </header>

  <div class="stats" id="stats"></div>

  <nav class="sticky"><div class="chips" id="chips"></div></nav>

  <main id="main"></main>

  <div class="back-wrap">
    <a href="index.html" class="back-btn">🏠 返回首页</a>
  </div>

  <footer>
    © 2026 <span class="coach-tip" tabindex="0">两英豆豆教练<span class="tip2">微信号 ddtt0754</span></span>
  </footer>
</div>

<script>
/* =====================================================================
 * ★ 静态数据区 ★ —— 摘自《1–9 年级阅读规划（中文 · 英语）》
 *   字段说明：
 *     w       中文年阅读量（万字），用于总览阶梯条长度
 *     cn.books 必读书目原文（含《》），渲染时自动拆成胶囊
 *     en.rows  英语各项，[标签, 内容]，标签沿用原表措辞
 * ===================================================================== */
var GRADES = [
{ n:'一年级', stage:'启蒙期：图画书 + 儿歌', w:3,
  cnMain:'图画书 · 童谣（亲子共读）', enMain:'RAZ AA–B ＋ 牛津树 1–3（听读启蒙）', lex:'0–50L ／ ＜300 词',
  cn:{ books:'《和大人一起读（一）～（六）》、《读读童谣和儿歌》', bcnt:'2 套 7 册', bn:7,
       focus:'亲子共读、指读认字、感受儿歌韵律；能看图说 1–2 句完整的话',
       pace:'每天 15 分钟；每学期 6–8 册；全年约 3 万字',
       check:'背诵过关、图意复述、生字认读' },
  en:{ note:'启蒙弹性，三年级起点的学校可只做听读', rows:[
       ['分级主线','RAZ AA–B；牛津阅读树 1–3（**只做听读跟读，不刷题**）'],
       ['绘本 / 桥梁','《Elephant & Piggie》小猪小象（短句口语）、《Frog and Toad》青蛙和蟾蜍（亲子听读）'],
       ['词汇 / 蓝思','＜300 词 ／ 0–50L'],
       ['节奏与量','每天 10 分钟；每周 3–5 本分级小册'],
       ['检测方式','图片指认、跟读录音、字母音认读'] ] } },

{ n:'二年级', stage:'童话与儿童故事', w:6,
  cnMain:'童话 · 儿童故事（注音桥梁）', enMain:'RAZ C–D ＋ 牛津树 3–4 ＋ 黑布林 A–B', lex:'50–100L ／ 300–600 词',
  cn:{ books:'《小鲤鱼跳龙门》《“歪脑袋”木头桩》《孤独的小螃蟹》《小狗的小房子》《一只想飞的猫》《七色花》《愿望的实现》《大头儿子和小头爸爸》', bcnt:'8 本',
       focus:'从「听」到「自己读」，读注音版整本书；能按顺序讲清一个故事',
       pace:'每天 20 分钟；每学期 8 本；全年约 6 万字',
       check:'故事复述（起因—经过—结果）、古诗背诵、好词摘抄' },
  en:{ note:'', rows:[
       ['分级主线','RAZ C–D；牛津树 3–4；黑布林小学 A–B 级'],

/* ================= 工具函数 ================= */
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* 行内 markdown：**粗体** + 《书名》强调 */
function inl(s){
  var h = esc(s);
  h = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  h = h.replace(/《([^》]+)》/g,'<em>《$1》</em>');
  return h;
}
/* 书名串 → 胶囊数组：按《》切分，保留紧邻的括注与「十二章」这类短尾 */
function books(s){
  var out = [];
  String(s||'').split('《').slice(1).forEach(function(p){
    var i = p.indexOf('》');
    if (i < 0) return;
    var name = p.slice(0, i);
    var tail = p.slice(i + 1);
    tail = tail.replace(/^[、，,；;\s]+/, '').split('《')[0].trim();
    var keep = /^[（(][^）)]*[）)]$/.test(tail) ||
               (tail.length > 0 && tail.length <= 8 && !/[、，]/.test(tail));
    if (!keep) tail = '';
    if (name) out.push(name + tail);
  });
  return out;
}
function pill(list, cls){
  if (!list.length) return '';
  return '<div class="pills ' + cls + '">' +
    list.map(function(x){ return '<span>' + esc(x) + '</span>'; }).join('') + '</div>';
}

/* ================= 渲染：吸顶导航 + 滚动高亮 ================= */
(function(){
  var NAV = [['总览','s-ov'],['原则','s-pr']]
    .concat(GRADES.map(function(g, i){ return [g.n, 's-g' + (i + 1)]; }))
    .concat([['执行','s-ex']]);

  var box = document.getElementById('chips');
  box.innerHTML = NAV.map(function(n, i){
    return '<button class="chip' + (i === 0 ? ' on' : '') + '" data-t="' + n[1] + '">' + n[0] + '</button>';
  }).join('');

  var chips = box.querySelectorAll('.chip');
  function activate(id){
    Array.prototype.forEach.call(chips, function(c){
      c.className = 'chip' + (c.getAttribute('data-t') === id ? ' on' : '');
    });
  }
  Array.prototype.forEach.call(chips, function(c){
    c.onclick = function(){
      var el = document.getElementById(c.getAttribute('data-t'));
      if (!el) return;
      activate(c.getAttribute('data-t'));
      el.scrollIntoView({ behavior:'smooth', block:'start' });
    };
  });

  /* 首屏：总览与一年级共用 id 区段，用 IO 高亮最靠近顶部的那一段 */
  var secs = NAV.map(function(n){ return document.getElementById(n[1]); }).filter(Boolean);
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(es){
      var vis = es.filter(function(e){ return e.isIntersecting; })
                  .sort(function(a, b){ return a.boundingClientRect.top - b.boundingClientRect.top; });
      if (vis.length) activate(vis[0].target.id);
    }, { rootMargin:'-64px 0px -62% 0px', threshold:0 });
    secs.forEach(function(s){ io.observe(s); });
  }

  /* 让当前 chip 自动滚入可视区 */
  Array.prototype.forEach.call(chips, function(c){
    c.addEventListener('click', function(){
      var l = c.offsetLeft - box.clientWidth / 2 + c.offsetWidth / 2;
      box.scrollTo({ left: Math.max(l, 0), behavior:'smooth' });
    });
  });
})();
</script>
