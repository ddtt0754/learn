<title>豆豆知识库 · 内容清单</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --text:#1e293b; --sub:#64748b; --faint:#94a3b8;
  --line:#e8eef4; --g1:#35d29a; --g2:#2f9df0; --accent:#2ebd85; --accentbg:#e8f7f0;
  --fs-h1:17.5px; --fs-h2:14px; --fs-body:12.5px; --fs-note:11.5px;
  --sh:0 2px 10px rgba(47,157,240,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-size:var(--fs-body); line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 0}

/* ---------- 头部（版式对齐 vip-trip.html：独立圆角渐变卡） ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;
  padding:22px 18px 20px;text-align:center;
  box-shadow:0 10px 26px rgba(47,157,240,.20)}
.hero .c1,.hero .c2{position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .c1{width:118px;height:118px;top:-46px;left:-34px}
.hero .c2{width:78px;height:78px;bottom:-34px;right:-18px}
.hero h1{margin:0;font-size:var(--fs-h1);font-weight:800;letter-spacing:.3px;line-height:1.5;position:relative}
.hero .sub{display:inline-block;max-width:100%;margin:10px 0 0;padding:5px 14px;border-radius:999px;
  background:rgba(255,255,255,.20);border:1px solid rgba(255,255,255,.55);
  font-size:var(--fs-body);font-weight:700;color:#fff;letter-spacing:.2px;
  word-break:break-word;position:relative}
.hero .stat{display:flex;justify-content:center;gap:10px;margin-top:14px;position:relative}
.hero .stat div{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);
  border-radius:999px;padding:4px 13px;font-size:var(--fs-note);font-weight:600}

/* ---------- 工具栏 ---------- */
.tools{position:sticky;top:0;z-index:20;background:rgba(245,247,250,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:10px 0 8px;margin-top:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:0 14px;height:38px;box-shadow:var(--sh)}
.search svg{flex:0 0 auto;opacity:.5}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:var(--fs-body);
  color:var(--text);font-family:inherit;min-width:0}
.search input::placeholder{color:var(--faint)}
.search .clr{flex:0 0 auto;display:none;width:20px;height:20px;border-radius:50%;border:0;
  background:#e2e8f0;color:#64748b;font-size:12px;line-height:20px;text-align:center;cursor:pointer;padding:0}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{flex:0 1 auto;max-width:100%;background:var(--card);border:1px solid var(--line);color:var(--sub);
  border-radius:999px;padding:3px 11px;font-size:var(--fs-note);text-decoration:none;white-space:nowrap;
  transition:.18s}
.chip:active{transform:scale(.95);background:var(--accentbg);color:var(--accent)}
.chip b{font-weight:600}

/* ---------- 分类卡 ---------- */
.cat{background:var(--card);border-radius:14px;box-shadow:var(--sh);margin-top:12px;overflow:hidden}
.cat.hide{display:none}
.cat.isNew{box-shadow:0 0 0 1.5px rgba(53,210,154,.32),var(--sh)}
.cat > .hd{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
.cat > .hd:active{background:#f8fbfe}
.num{flex:0 0 auto;width:24px;height:24px;border-radius:8px;color:#fff;font-size:var(--fs-note);
  font-weight:700;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--g1),var(--g2))}
.tt{flex:1;min-width:0}
.tt h2{margin:0;font-size:var(--fs-h2);font-weight:700;line-height:1.45}
.tt span{display:block;font-size:var(--fs-note);color:var(--faint);margin-top:1px}
.badge{flex:0 0 auto;background:var(--accentbg);color:var(--accent);border-radius:999px;
  padding:2px 9px;font-size:var(--fs-note);font-weight:600}
.newtag{display:inline-block;margin-left:6px;font-style:normal;font-size:10px;font-weight:700;
  color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:999px;
  padding:1px 6px;vertical-align:1.5px;letter-spacing:.5px}
.arrow{flex:0 0 auto;color:var(--faint);font-size:11px;transition:transform .22s}
.cat.open .arrow{transform:rotate(90deg)}

/* ---------- 条目 ---------- */
.list{display:none;padding:0 14px 12px}
.cat.open .list{display:block}
.li{display:flex;gap:9px;padding:7px 0;border-top:1px dashed var(--line);align-items:flex-start}
.li:first-child{border-top:1px solid var(--line)}
.li i{flex:0 0 auto;width:20px;font-style:normal;color:var(--faint);font-size:var(--fs-note);
  text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.li .nm{flex:1;min-width:0;word-break:break-word}
.li.hide{display:none}
.li mark{background:#fff3bf;color:#8a6d00;border-radius:3px;padding:0 1px}
.note{margin:8px 0 0;font-size:var(--fs-note);color:var(--faint);background:var(--bg);
  border-radius:9px;padding:8px 10px;line-height:1.6}
.empty{display:none;background:var(--card);border-radius:14px;box-shadow:var(--sh);
  margin-top:12px;padding:30px 16px;text-align:center;color:var(--faint);font-size:var(--fs-body)}

/* ---------- 底部 ---------- */
.foot{text-align:center;padding:22px 14px 6px;color:var(--faint);font-size:var(--fs-note);line-height:1.9}
/* 页脚署名：触摸/悬停「两英豆豆教练」→ 弹出微信号气泡（站内标准 .coach-tip 写法） */
.coach-tip{position:relative;display:inline-block;cursor:pointer;color:var(--accent);font-weight:600;
  -webkit-tap-highlight-color:transparent}
.coach-tip .tip{visibility:hidden;opacity:0;position:absolute;bottom:145%;left:50%;
  transform:translateX(-50%) translateY(4px);background:linear-gradient(135deg,var(--g1),var(--g2));
  color:#fff;padding:7px 14px;border-radius:10px;font-size:12.5px;font-weight:700;white-space:nowrap;
  letter-spacing:.5px;z-index:99;pointer-events:none;box-shadow:0 6px 18px rgba(47,157,240,.35);
  transition:opacity .2s ease,transform .2s ease,visibility .2s}
.coach-tip .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--g2)}
.coach-tip:hover .tip,.coach-tip:active .tip,.coach-tip:focus .tip{
  visibility:visible;opacity:1;transform:translateX(-50%) translateY(0)}
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(245,247,250,.98) 60%,rgba(245,247,250,0))}
.back-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--g1),var(--g2));
  color:#fff;border:0;border-radius:999px;padding:10px 26px;font-size:0.95rem;font-weight:600;
  font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(47,157,240,.28);transition:.18s}
.back-btn:active{transform:scale(.95)}
.totop{position:fixed;right:14px;bottom:calc(146px + env(safe-area-inset-bottom));z-index:25;
  width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--accent);
  box-shadow:0 3px 12px rgba(47,157,240,.16);font-size:15px;cursor:pointer;display:none}
.totop.on{display:block}

/* ---------- VIP 悬浮按钮（右下 · 顶层） ---------- */
.vip-fab{position:fixed;right:14px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:40;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:84px;padding:9px 13px;border-radius:16px;text-align:center;
  background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;text-decoration:none;
  font-size:var(--fs-note);font-weight:600;line-height:1.3;letter-spacing:.3px;
  box-shadow:0 5px 18px rgba(47,157,240,.32);
  -webkit-tap-highlight-color:transparent;
  transition:transform .18s,box-shadow .18s;
  animation:vipPulse 2.6s ease-in-out infinite}
.vip-fab b{display:block;font-size:var(--fs-body);font-weight:800;letter-spacing:.2px}
.vip-fab span{display:block;opacity:.94}
.vip-fab:active{transform:scale(.94);box-shadow:0 2px 8px rgba(47,157,240,.34)}
@keyframes vipPulse{
  0%,100%{box-shadow:0 5px 18px rgba(47,157,240,.32)}
  50%    {box-shadow:0 5px 24px rgba(53,210,154,.58)}
}
@media (prefers-reduced-motion:reduce){.vip-fab{animation:none}}
</style>
</head>

    note:"对应网盘目录「9.其他未分类（更新)」，为最近新增收录，含学习规划、英语口语、习惯工具表格三类；文件夹名称与层级照原目录保留。",
    items:[
    "【清华子贤】致家长的「学习高手养成攻略」",
    "【尧尧老师】3-18岁学习规划+学习方法指导课（录播课）",
    "【尧尧老师学业规划】配套资料PDF",
    "黄冈生分享.复旦黎学长资料分享",
    "美剧高频口语9000句-地道口语精选",
    "365天英语口语大全：日常口语篇",
    "英语鬼才一凡老师",
    "儿童时间管理工具表格",
    "【好习惯养成积分激励表】"
  ]}
];
/* ================================================================ */

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
};
var TOTAL = DATA.reduce(function(a,c){ return a + c.items.length; }, 0);

/* ---- 渲染 ---- */
function render(){
  var cats = DATA.map(function(c){
    var lis = c.items.map(function(name, i){
      return '<div class="li" data-nm="' + esc(name.toLowerCase()) + '">'
           +   '<i>' + (i + 1) + '</i>'
           +   '<div class="nm">' + esc(name) + '</div>'
           + '</div>';
    }).join('');
    var note = c.note ? '<p class="note">' + esc(c.note) + '</p>' : '';
    var newTag = c.isNew ? '<em class="newtag">NEW</em>' : '';
    return '<section class="cat open' + (c.isNew ? ' isNew' : '') + '" id="cat' + c.no + '" data-no="' + c.no + '">'
         +   '<div class="hd">'
         +     '<div class="num">' + c.no + '</div>'
         +     '<div class="tt"><h2>' + esc(c.name) + newTag + '</h2><span>' + esc(c.tag) + '</span></div>'
         +     '<div class="badge">' + c.items.length + ' 个</div>'
         +     '<div class="arrow">▶</div>'
         +   '</div>'
         +   '<div class="list">' + lis + note + '</div>'
         + '</section>';
  }).join('');
  $('cats').innerHTML = cats;

  $('chips').innerHTML = DATA.map(function(c){
    return '<a class="chip" href="#cat' + c.no + '"><b>' + c.no + '</b> ' + esc(c.name) + '</a>';
  }).join('');

  var NEWN = DATA.reduce(function(a,c){ return a + (c.added || 0); }, 0);
  $('stCat').textContent = DATA.length + ' 大类';
  $('stItem').textContent = TOTAL + ' 个小类';
  $('stNew').textContent = NEWN ? '本次新增 ' + NEWN + ' 项' : '暂无新增';
}

/* ---- 折叠 ---- */
document.addEventListener('click', function(e){
  var hd = e.target.closest('.hd');
  if (hd) {
    var cat = hd.parentNode;
    cat.classList.toggle('open');
    return;
  }
  var chip = e.target.closest('.chip');
  if (chip) {
    var no = chip.getAttribute('href').slice(1);
    var el = document.getElementById(no);
    if (el) { el.classList.add('open'); }
  }
});

/* ---- 搜索 ---- */
var openSnap = null;   /* 搜索前的展开状态快照，清空搜索后原样还原 */

function doSearch(){
  var kw = $('q').value.trim().toLowerCase();
  $('clr').style.display = kw ? 'block' : 'none';

  var cats = document.querySelectorAll('#cats .cat');
  var i, j;

  if (kw && openSnap === null){
    openSnap = {};
    for (i = 0; i < cats.length; i++){
      openSnap[cats[i].id] = cats[i].classList.contains('open');
    }
  }

  var shown = 0;
  for (i = 0; i < cats.length; i++){
    var cat = cats[i], hit = 0;
    var lis = cat.querySelectorAll('.li');
    for (j = 0; j < lis.length; j++){
      var li = lis[j];
      var ok = !kw || li.getAttribute('data-nm').indexOf(kw) > -1;
      li.classList.toggle('hide', !ok);
      if (ok) hit++;

      var nm = li.querySelector('.nm');
      if (kw && ok) {
        nm.innerHTML = highlight(li.getAttribute('data-nm0'), kw);
      } else {
        nm.textContent = li.getAttribute('data-nm0');
      }
    }
    cat.classList.toggle('hide', hit === 0);
    if (kw) {
      cat.classList.toggle('open', hit > 0);          /* 搜索时只展开命中的分类 */
    } else if (openSnap) {
      cat.classList.toggle('open', !!openSnap[cat.id]); /* 清空后还原搜索前的展开状态 */
    }
    if (hit) shown++;
  }

  if (!kw) openSnap = null;
  $('empty').style.display = (kw && !shown) ? 'block' : 'none';
}

function highlight(text, kw){
  var out = '', low = text.toLowerCase(), p = 0, k = low.indexOf(kw);
  while (k > -1){
    out += esc(text.slice(p, k)) + '<mark>' + esc(text.slice(k, k + kw.length)) + '</mark>';
    p = k + kw.length;
    k = low.indexOf(kw, p);
  }
  return out + esc(text.slice(p));
}

/* 记录原文，避免高亮后反复套娃 */
function snapshot(){
  var lis = document.querySelectorAll('#cats .li .nm');
  for (var i = 0; i < lis.length; i++){
    var li = lis[i].parentNode;
    li.setAttribute('data-nm0', lis[i].textContent);
  }
}

$('q').addEventListener('input', doSearch);
$('clr').addEventListener('click', function(){ $('q').value = ''; doSearch(); $('q').focus(); });

/* ---- 回顶 + 回顶浮标 ---- */
function toTop(){ window.scrollTo({ top: 0, behavior: 'smooth' }); }
$('backBtn').addEventListener('click', toTop);
$('totop').addEventListener('click', toTop);
window.addEventListener('scroll', function(){
  $('totop').classList.toggle('on', window.scrollY > 400);
});

/* 页脚微信号气泡：纯 CSS（.coach-tip:hover/:active/:focus），无需脚本 */

render();
snapshot();
</script>
</body>
